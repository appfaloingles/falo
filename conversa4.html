<style>
  :root{--ground:#FAF5F1;--surface:#FFFFFF;--surface-2:#F4ECE6;--ink:#241722;--ink-soft:#8A7A75;--line:#ECE0D9;--brand:#FF5630;--brand-deep:#E8431F;--brand-soft:#FFEBE4;--teal:#0FB39B;--teal-soft:#DBF4EF;--teal-ink:#0A7E6E;--shadow-sm:0 6px 18px -12px rgba(60,26,20,.5)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#161016;--surface:#221826;--surface-2:#2B1F30;--ink:#F6EBE9;--ink-soft:#B0A0A0;--line:#352640;--brand:#FF6A47;--brand-soft:#3A201C;--teal:#25C9B2;--teal-ink:#7FE9D9;--shadow-sm:0 8px 20px -12px rgba(0,0,0,.65)}}
  :root[data-theme="dark"]{--ground:#161016;--surface:#221826;--surface-2:#2B1F30;--ink:#F6EBE9;--ink-soft:#B0A0A0;--line:#352640;--brand:#FF6A47;--brand-soft:#3A201C;--teal:#25C9B2;--teal-ink:#7FE9D9;--shadow-sm:0 8px 20px -12px rgba(0,0,0,.65)}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Figtree",system-ui,sans-serif;color:var(--ink);line-height:1.5;background:radial-gradient(1100px 500px at 50% -10%,color-mix(in srgb,var(--brand) 12%,transparent),transparent 60%),var(--ground);min-height:100vh;-webkit-font-smoothing:antialiased;padding:0 0 90px}
  .display{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.08}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}
  .top{position:sticky;top:0;z-index:20;padding:14px 18px;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .icon{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}.icon svg{width:18px;height:18px}
  .word{font-family:"Bricolage Grotesque";font-weight:800;font-size:21px;letter-spacing:-.03em}.word b{color:var(--brand)}
  .themeBtn{margin-left:auto;border:none;cursor:pointer;width:32px;height:32px;border-radius:9px;background:var(--surface);box-shadow:var(--shadow-sm);font-size:15px}
  header.hero{padding:26px 0 6px}
  .eyebrow{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--brand)}
  header.hero h1{font-size:clamp(24px,6vw,34px);margin:8px 0 6px}
  header.hero p{color:var(--ink-soft);font-weight:600;font-size:15px;margin:0}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
  .ctl{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:"Figtree";font-weight:700;font-size:13.5px;border-radius:12px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-sm)}
  .ctl.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .ctl.play{background:linear-gradient(135deg,var(--brand),#FF7B4D);color:#fff;border:none}
  #chat{display:flex;flex-direction:column;gap:14px;margin-top:16px}
  .msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
  .msg.B{flex-direction:row-reverse;align-self:flex-end}
  .ava{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
  .bub{background:var(--surface);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;padding:12px 14px;box-shadow:var(--shadow-sm)}
  .msg.B .bub{background:var(--brand-soft);border-bottom-left-radius:18px;border-bottom-right-radius:6px}
  .who{font-weight:800;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px}
  .en{font-size:16px;font-weight:600}
  .pt{font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-top:5px;font-style:italic;display:none}
  .pt.show{display:block}
  .row{display:flex;gap:8px;margin-top:9px}
  .mini{width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;background:var(--surface-2);color:var(--brand);font-size:15px;display:grid;place-items:center}
  .mini.p{background:var(--brand);color:#fff}
  .msg.playing .bub{outline:2px solid var(--brand);outline-offset:1px}
  .tip{margin-top:8px;color:var(--ink-soft);font-size:11.5px;font-weight:600}
  .nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
  .cta{display:block;max-width:680px;margin:0 auto;text-align:center;border:none;cursor:pointer;font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--brand),#FF7B4D);padding:14px;border-radius:14px}
  #home{position:fixed;left:10px;bottom:78px;z-index:40;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;text-decoration:none;background:linear-gradient(135deg,#FF5630,#FF7B4D);color:#fff;box-shadow:0 8px 20px -8px rgba(232,67,31,.55)}
