  chat.addEventListener("click",e=>{ const pb=e.target.closest("[data-play]"); if(pb){ playingAll=false; play(+pb.dataset.play); return; }
    const tb=e.target.closest("[data-pt]"); if(tb){ tb.closest(".bub").querySelector(".pt").classList.toggle("show"); } });
  document.getElementById("playAll").onclick=function(){ if(playingAll){ playingAll=false; stop(); this.textContent="▶ Ouvir a conversa"; return; }
    playingAll=true; this.textContent="⏸ Pausar"; const self=this; let i=0;
    (function next(){ if(!playingAll||i>=DIALOG.length){ playingAll=false; self.textContent="▶ Ouvir a conversa"; return; } play(i,()=>{ i++; setTimeout(next,450); }); })(); };
  document.getElementById("tglPt").onclick=function(){ const on=this.classList.toggle("on"); document.querySelectorAll(".pt").forEach(p=>p.classList.toggle("show",on)); };
  document.getElementById("tglSlow").onclick=function(){ slow=!slow; this.classList.toggle("on",slow); if(cur)cur.playbackRate=slow?0.72:1; };
  document.getElementById("cta").onclick=function(){ this.textContent="🎉 Treino concluído!"; this.style.background="var(--teal)"; };
  const tb=document.getElementById("theme"); function ap(m){document.documentElement.setAttribute("data-theme",m);tb.textContent=m==="dark"?"☀️":"🌙";}
  try{ap(localStorage.getItem("falo_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));}catch(e){ap("light");}
  tb.onclick=()=>{const m=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";ap(m);try{localStorage.setItem("falo_theme",m);}catch(e){}};
  if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
